<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hawkeyes — Audit Logs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <header id="hk-navbar"></header>

  <main class="container py-4">
    <div class="d-flex align-items-center mb-4" style="gap: 0.75rem;">
      <div class="hk-logo" style="width: 40px; height: 40px; font-size: 1rem; border-radius: 10px;">HK</div>
      <h3 class="mb-0">Audit Trail (Data Privacy)</h3>
    </div>
    <div id="pageAlert"></div>

    <div class="card">
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-md-3">
            <select id="filterAction" class="form-select">
              <option value="">All actions</option>
              <option>CREATE</option><option>READ</option><option>UPDATE</option>
              <option>DELETE</option><option>LOGIN</option><option>ACCESS_DENIED</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="filterTable" class="form-select">
              <option value="">All entities</option>
              <option value="patients">patients</option>
              <option value="prescriptions">prescriptions</option>
              <option value="users">users</option>
              <option value="appointments">appointments</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle">
            <thead><tr>
              <th>Timestamp</th><th>User</th><th>Action</th><th>Entity</th>
              <th>Record</th><th>IP Address</th><th>Details</th>
            </tr></thead>
            <tbody id="auditBody">
              <tr><td colspan="7" class="text-muted text-center py-4">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <small class="text-muted" id="pageInfo"></small>
          <div>
            <button class="btn btn-sm btn-outline-primary" id="prevPage">◀ Prev</button>
            <button class="btn btn-sm btn-outline-primary" id="nextPage">Next ▶</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hk-footer">Hawkeyes Optical — immutable audit of all sensitive data access</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/audit.js"></script>
</body>
</html>
