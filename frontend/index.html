<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hawkeyes Optical System — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container hk-login-wrap">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body p-4" style="background: var(--hk-surface);">
            <div class="text-center mb-3">
              <div class="hk-logo mx-auto mb-2">HK</div>
              <h4 class="mb-0">Hawkeyes Optical System</h4>
              <p class="text-muted small mb-0">Prescription &amp; Appointment Management</p>
            </div>

            <div id="loginAlert"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" required autocomplete="username" />
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password" />
              </div>
              <button type="submit" class="btn btn-primary w-100" id="loginBtn">Log In</button>
            </form>

            <!-- Identity Resolution (System Rule 3) -->
            <div class="accordion mt-3" id="registerAcc">
              <div class="accordion-item">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed py-2 fs-6" data-bs-toggle="collapse"
                          data-bs-target="#registerBody">
                    New here? Link your clinic record
                  </button>
                </h2>
                <div id="registerBody" class="accordion-collapse collapse" data-bs-parent="#registerAcc">
                  <div class="accordion-body pt-2">
                    <p class="small text-muted mb-2">
                      Online accounts are linked to your physical clinic record using your
                      Hawkeyes Patient ID <code>HK-00000</code> and birth date.
                    </p>
                    <form id="registerForm" novalidate>
                      <input class="form-control form-control-sm mb-2" id="regName"
                             placeholder="Full name" required />
                      <input class="form-control form-control-sm mb-2" id="regEmail"
                             type="email" placeholder="Email" required />
                      <input class="form-control form-control-sm mb-2" id="regPassword"
                             type="password" placeholder="Password (min 8 chars)" required />
                      <input class="form-control form-control-sm mb-2" id="regHkId"
                             placeholder="Hawkeyes Patient ID e.g. HK-00001" required />
                      <input class="form-control form-control-sm mb-2" id="regDob" type="date" required />
                      <button type="submit" class="btn btn-outline-primary btn-sm w-100"
                              id="registerBtn">Create Account</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <footer class="hk-footer mt-3">Hawkeyes Optical — Capstone Project</footer>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
