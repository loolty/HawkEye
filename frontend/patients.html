<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hawkeyes — Patients</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <header id="hk-navbar"></header>

  <main class="container py-4">
    <div class="d-flex align-items-center mb-4" style="gap: 0.75rem;">
      <div class="hk-logo" style="width: 40px; height: 40px; font-size: 1rem; border-radius: 10px;">HK</div>
      <h3 class="mb-0">Patient Records</h3>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#patientModal"
              onclick="openCreateForm()">+ Register Patient</button>
    </div>
    <div id="pageAlert"></div>

    <div class="card">
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <input id="searchBox" class="form-control" placeholder="Search name or HK ID…" />
          </div>
          <div class="col-md-3">
            <select id="pageSize" class="form-select">
              <option value="10">10 per page</option>
              <option value="20" selected>20 per page</option>
              <option value="50">50 per page</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>HK ID</th><th>Name</th><th>DOB</th><th>Sex</th><th>Contact</th><th>Email</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody id="patientsBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <small class="text-muted" id="pageInfo"></small>
          <div>
            <button class="btn btn-sm btn-outline-primary" id="prevPage">◀ Prev</button>
            <button class="btn btn-sm btn-outline-primary" id="nextPage">Next ▶</button>
          </div>
        </div>
      </div>
    </div>

    <!-- create / edit modal -->
    <div class="modal fade" id="patientModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="patientModalTitle">Register Patient</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="patientForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label">First Name *</label>
                <input class="form-control" id="pFirst" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Last Name *</label>
                <input class="form-control" id="pLast" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Date of Birth *</label>
                <input class="form-control" id="pDob" type="date" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Sex</label>
                <select class="form-select" id="pSex">
                  <option value="">—</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Contact Number</label>
                <input class="form-control" id="pContact" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input class="form-control" id="pEmail" type="email" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Address</label>
                <input class="form-control" id="pAddress" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary" id="patientSaveBtn">Save Patient</button>
          </div>
        </div>
      </div>
    </div>

    <!-- prescription history modal -->
    <div class="modal fade" id="historyModal" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="historyTitle">Prescription History</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body table-responsive" id="historyBody"></div>
        </div>
      </div>
    </div>

    <footer class="hk-footer">Hawkeyes Optical — every view of patient data is audit-logged</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/patients.js"></script>
</body>
</html>
