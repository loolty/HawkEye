<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hawkeyes — User Accounts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <header id="hk-navbar"></header>

  <main class="container py-4">
    <div class="d-flex align-items-center mb-4" style="gap: 0.75rem;">
      <div class="hk-logo" style="width: 40px; height: 40px; font-size: 1rem; border-radius: 10px;">HK</div>
      <h3 class="mb-0">User Accounts (RBAC)</h3>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal"
              onclick="openCreateForm()">+ Create Account</button>
    </div>
    <div id="pageAlert"></div>

    <div class="card">
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-md-5">
            <input id="searchBox" class="form-control" placeholder="Search name or email…" />
          </div>
          <div class="col-md-3">
            <select id="filterRole" class="form-select">
              <option value="">All roles</option>
              <option value="admin">admin</option>
              <option value="optometrist">optometrist</option>
              <option value="front_desk">front_desk</option>
              <option value="patient">patient</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead><tr>
              <th>Name</th><th>Email</th><th>Role</th><th>Status</th>
              <th>Linked Patient</th><th>Created</th><th class="text-end">Actions</th>
            </tr></thead>
            <tbody id="usersBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <small class="text-muted" id="pageInfo"></small>
          <div>
            <button class="btn btn-sm btn-outline-primary" id="prevPage">◀ Prev</button>
            <button class="btn btn-sm btn-outline-primary" id="nextPage">Next ▶</button>
          </div>
        </div>
      </div>
    </div>

    <!-- create modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Create Account</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="userForm">
              <div class="mb-2">
                <label class="form-label">Full Name *</label>
                <input class="form-control" id="uName" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Email *</label>
                <input class="form-control" id="uEmail" type="email" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Password * (min 8 chars)</label>
                <input class="form-control" id="uPassword" type="password" minlength="8" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Role *</label>
                <select class="form-select" id="uRole" required>
                  <option value="admin">admin</option>
                  <option value="optometrist">optometrist</option>
                  <option value="front_desk">front_desk</option>
                  <option value="patient">patient</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary" id="userSaveBtn">Create</button>
          </div>
        </div>
      </div>
    </div>

    <!-- reset password modal -->
    <div class="modal fade" id="pwModal" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="pwTitle">Reset Password</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input class="form-control" id="pwNew" type="password" minlength="8"
                   placeholder="New password (min 8 chars)" />
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary" id="pwSaveBtn">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hk-footer">Hawkeyes Optical — accounts are soft-deactivated to preserve audits</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/users.js"></script>
</body>
</html>
